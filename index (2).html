<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Result Countdown 2026</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#141c32;--line:#293554;--text:#f4f7ff;--muted:#aab6d2;--accent:#7c6cff;--cyan:#46d8f5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top,#202c55 0%,#0b1020 58%);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}
main{width:min(720px,100%);text-align:center;background:linear-gradient(155deg,rgba(24,34,61,.97),rgba(14,20,38,.98));border:1px solid var(--line);border-radius:28px;padding:clamp(24px,5vw,48px);box-shadow:0 24px 80px #0008}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #3a4770;background:#202b4c;color:#cbd6ff;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:#53e0a0;box-shadow:0 0 12px #53e0a0}
h1{font-size:clamp(32px,7vw,54px);line-height:1.06;letter-spacing:-.04em;margin:22px 0 12px}
.sub{color:var(--muted);font-size:16px;line-height:1.6;margin:0 auto 28px;max-width:510px}
.timer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:26px 0 30px}
.unit{background:#0c1327;border:1px solid #283657;border-radius:16px;padding:18px 8px}
.num{display:block;font-size:clamp(25px,5vw,40px);font-weight:850;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.label{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
button{border:0;border-radius:14px;padding:16px 24px;background:linear-gradient(100deg,var(--accent),#4d9bff);color:white;font-size:16px;font-weight:850;cursor:pointer;box-shadow:0 10px 30px #6559ff40;transition:transform .15s,filter .15s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
#result{display:none;margin-top:28px;padding:25px 16px;border-radius:20px;border:1px solid #6358d9;background:linear-gradient(135deg,#28245e,#14294d);animation:pop .45s ease}
#result.show{display:block}
#result h2{margin:0;font-size:clamp(27px,6vw,43px);letter-spacing:-.03em}
#result p{margin:10px 0 0;color:#cbd7ff}
.note{margin-top:24px;color:#7f8eaf;font-size:12px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:420px){.timer{gap:6px}.unit{padding:14px 4px}.label{font-size:9px}main{border-radius:22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const target = new Date("2026-10-22T10:00:00+05:00").getTime();
const ids = ["days","hours","minutes","seconds"];
function updateCountdown(){
  let diff = Math.max(0, target - Date.now());
  const totalSeconds = Math.floor(diff / 1000);
  const values = [
    Math.floor(totalSeconds / 86400),
    Math.floor((totalSeconds % 86400) / 3600),
    Math.floor((totalSeconds % 3600) / 60),
    totalSeconds % 60
  ];
  ids.forEach((id,i)=>document.getElementById(id).textContent=String(values[i]).padStart(2,"0"));
  if(diff===0) document.querySelector(".sub").textContent="The scheduled countdown has reached zero.";
}
updateCountdown();
setInterval(updateCountdown, 1000);

const button = document.getElementById("reveal");
const result = document.getElementById("result");
const audio = document.getElementById("prankAudio");
button.addEventListener("click", async () => {
  result.classList.add("show");
  document.getElementById("timer").style.display = "grid";
  document.querySelector(".pill").innerHTML = '<span class="dot"></span> Result countdown • 2026';
  document.querySelector("h1").textContent = "The Result Is Here!";
  document.querySelector(".sub").textContent = "Here is the result announcement countdown.";
  button.textContent = "🔊 Replay / Keep Audio Playing";
  try { await audio.play(); }
  catch (err) {
    button.textContent = "Tap to Play Audio";
  }
});
</script>
